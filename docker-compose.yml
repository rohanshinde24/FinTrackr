services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrackr-postgres
    environment:
      POSTGRES_DB: fintrackr_db
      POSTGRES_USER: fintrackr_user
      POSTGRES_PASSWORD: fintrackr_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrackr_user -d fintrackr_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fintrackr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dependencies
    container_name: fintrackr-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fintrackr_db
      DB_USER: fintrackr_user
      DB_PASSWORD: fintrackr_password
      JWT_SECRET: local-development-secret-at-least-32-characters
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - fintrackr-network
    command: sh -c "npm run db:migrate && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrackr-frontend
    environment:
      DEV_PROXY_TARGET: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fintrackr-network
    command: npm start

volumes:
  postgres_data:

networks:
  fintrackr-network:
    driver: bridge
