version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: fintrackr-postgres
    environment:
      POSTGRES_DB: fintrackr_db
      POSTGRES_USER: fintrackr_user
      POSTGRES_PASSWORD: fintrackr_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintrackr-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrackr-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fintrackr_db
      DB_USER: fintrackr_user
      DB_PASSWORD: fintrackr_password
      JWT_SECRET: your-super-secret-jwt-key-here
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - fintrackr-network
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintrackr-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fintrackr-network
    command: npm start

volumes:
  postgres_data:

networks:
  fintrackr-network:
    driver: bridge
